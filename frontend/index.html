<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGE 黄金仪表盘 (v4.40 - 动态缩放)</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    
    <style>
        /* --- (CSS v4.31 - 不变) --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5; margin: 0; padding: 10px; color: #333;
        }
        h1 { text-align: center; margin-bottom: 20px; font-size: 1.8rem; }
        .dashboard-container { 
            display: flex; flex-direction: column; 
            width: 100%; max-width: 1600px; margin: 0 auto; 
            gap: 20px; 
        }
        .top-row { display: flex; gap: 20px; width: 100%; }
        .bottom-row { width: 100%; }
        .main-content { flex: 7; min-width: 600px; box-sizing: border-box; }
        .sidebar-content { 
            flex: 3; min-width: 300px; display: flex; 
            flex-direction: column; gap: 20px; 
        }
        .widget-card {
            background-color: #ffffff; border: 1px solid #e8e8e8; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 20px; box-sizing: border-box;
            width: 100%; 
        }
        .widget-card h2 {
            margin-top: 0; margin-bottom: 15px; font-size: 1.25rem;
            border-bottom: 1px solid #f0f0f0; padding-bottom: 10px;
        }
        #chart-container { width: 100%; height: 550px; }
        #k-line-controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;}
        .k-line-button {
            padding: 8px 16px; font-size: 0.9rem; border: 1px solid #d9d9d9;
            background-color: #fff; color: #555; border-radius: 4px; cursor: pointer;
            transition: all 0.2s ease;
        }
        .k-line-button:hover { border-color: #40a9ff; color: #40a9ff; }
        .k-line-button.active { background-color: #1890ff; color: #fff; border-color: #1890ff; }
        .realtime-price { font-size: 2.0rem; font-weight: bold; color: #ff4d4f; margin-bottom: 10px; }
        .realtime-time { font-size: 0.9rem; color: #888; }
        .placeholder { color: #999; font-style: italic; }
        
        /* 新闻模块样式 (不变) */
        #news-content { height: 400px; overflow-y: auto; padding-right: 10px; }
        .news-item { border-bottom: 1px solid #f0f0f0; padding: 10px 0; margin-bottom: 5px; }
        .news-item:last-child { border-bottom: none; }
        .news-time { font-size: 0.85rem; color: #888; margin-bottom: 8px; }
        .news-title { font-size: 1rem; font-weight: bold; color: #333; margin-bottom: 5px; line-height: 1.4; }
        .news-content { font-size: 0.95rem; line-height: 1.5; color: #555; }
        
        /* 全球市场模块样式 (不变) */
        .global-market-item {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 1rem; margin-bottom: 12px; padding-bottom: 12px;
            border-bottom: 1px solid #f0f0f0;
        }
        .global-market-item:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .global-market-item .name { font-weight: bold; color: #333; }
        .global-market-item .price { font-size: 1.1rem; font-weight: bold; }
        .global-market-item .change {
            font-size: 1rem; font-weight: bold; padding: 4px 8px;
            border-radius: 4px; color: #fff;
        }
        .change-up { background-color: #ff4d4f; } /* 涨 (红) */
        .change-down { background-color: #52c41a; } /* 跌 (绿) */
        .change-flat { background-color: #aaa; } /* 平 */

        @media (max-width: 992px) {
            body { padding: 5px; }
            .top-row { flex-direction: column; }
            .main-content { min-width: 100%; order: 2; } 
            .widget-card { padding: 15px; } 
            .sidebar-content { min-width: 100%; order: 1; }
            #realtime-quote-widget { order: 1; }
            #global-markets-widget { order: 2; }
            #ai-widget { order: 3; } 
            #chart-container { height: 400px; }
            h1 { font-size: 1.5rem; }
            .realtime-price { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <h1 style="text-align: center; margin-bottom: 20px;">SGE 黄金 (Au99.99) 仪表盘</h1>
    
    <div class="dashboard-container">
        
        <div class="top-row">
            <div class="main-content">
                <div id="k-line-card" class="widget-card">
                    <h2>图表</h2>
                    <div id="k-line-controls">
                        <button class="k-line-button active" data-type="intraday">分时</button>
                        <button class="k-line-button" data-type="kline" data-period="daily">日K</button>
                        <button class="k-line-button" data-type="kline" data-period="weekly">周K</button>
                        <button class="k-line-button" data-type="kline" data-period="monthly">月K</button>
                    </div>
                    <div id="chart-container"></div>
                </div>
            </div>

            <div class="sidebar-content">
                <div id="realtime-quote-widget" class="widget-card">
                    <h2>实时行情 (Au99.99)</h2>
                    <div id="realtime-content">
                        <div class="placeholder">正在加载实时价格...</div>
                    </div>
                </div>
                
                <div id="global-markets-widget" class="widget-card">
                    <h2>全球市场</h2>
                    <div id="global-markets-content">
                        <div class="placeholder">正在加载...</div>
                    </div>
                </div>

                <div id="ai-widget" class="widget-card">
                    <h2>AI分析 (日K)</h2>
                    <div id="ai-content">
                        <div class="placeholder">正在加载 AI 信号...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-row">
            <div id="news-widget" class="widget-card">
                <h2>贵金属快讯 (SHMET)</h2>
                <div id="news-content">
                    <div class="placeholder">正在加载新闻...</div>
                </div>
            </div>
        </div>

    </div> 
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            const API_BASE_URL = ""; 
            const chartContainer = document.getElementById('chart-container');
            const myChart = echarts.init(chartContainer);
            
            // --- 1. K线图模板 (v4.40 - 修复 Tooltip 索引) ---
            const kLineOptionTemplate = {
                tooltip: { 
                    trigger: 'axis', 
                    axisPointer: { type: 'cross' },
                    formatter: function (params) {
                        let date = params[0].name; let tooltipHtml = `${date}<br/>`; 
                        params.forEach(param => {
                            let seriesName = param.seriesName; let color = param.color; let value = param.value;
                            let marker = `<span style="display:inline-block;margin-right:5px;border-radius:10px;width:10px;height:10px;background-color:${color};"></span>`;
                            if (seriesName === 'K线') {
                                // (v4.40 修复) 索引从 0 开始
                                // value[1]=open, value[2]=close, value[3]=low, value[4]=high
                                tooltipHtml += `${marker} <strong>${seriesName}</strong><br/>`;
                                tooltipHtml += `  开盘价: <strong>${value[1]}</strong><br/>`;
                                tooltipHtml += `  收盘价: <strong>${value[2]}</strong><br/>`;
                                tooltipHtml += `  最低价: <strong>${value[3]}</strong><br/>`;
                                tooltipHtml += `  最高价: <strong>${value[4]}</strong><br/>`;
                            } else if (seriesName.startsWith('MA')) {
                                if (value !== null && value !== undefined) { 
                                     tooltipHtml += `${marker} ${seriesName}: <strong>${value}</strong><br/>`;
                                }
                            }
                        });
                        return tooltipHtml;
                    }
                },
                legend: { data: ['K线', 'MA5', 'MA10', 'MA20'], top: 0 },
                grid: [ { left: '20px', right: '20px', height: '65%', containLabel: true } ],
                xAxis: [ { type: 'category', data: [], gridIndex: 0, scale: true } ],
                yAxis: [ { type: 'value', gridIndex: 0, scale: true, splitLine: { show: true }, axisLabel: { formatter: '{value} CNY' } } ],
                // (v4.40 修改) dataZoom 不再使用 start/end 百分比
                dataZoom: [ 
                    { type: 'inside', xAxisIndex: [0] }, 
                    { type: 'slider', xAxisIndex: [0], top: '85%' } 
                ],
                series: [ 
                    { 
                        name: 'K线', type: 'candlestick', 
                        xAxisIndex: 0, yAxisIndex: 0, data: [],
                        markPoint: { data: [ { type: 'max', valueDim: 'highest' }, { type: 'min', valueDim: 'lowest' } ] }
                    },
                    { name: 'MA5', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: [], smooth: true, showSymbol: false, lineStyle: { width: 1, opacity: 0.8 } },
                    { name: 'MA10', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: [], smooth: true, showSymbol: false, lineStyle: { width: 1, opacity: 0.8 } },
                    { name: 'MA20', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: [], smooth: true, showSymbol: false, lineStyle: { width: 1, opacity: 0.8 } }
                ]
            };
            
            // --- 2. 分时图模板 (v4.24 - 修复 20:00 空白) (不变) ---
            const intradayOptionTemplate = {
                tooltip: { 
                    trigger: 'axis',
                    formatter: function (params) {
                        var param = params[0]; if (!param || param.value === '-' || param.value === null) { return null; }
                        return param.name + '<br />价格: ' + param.value;
                    }
                },
                grid: [ { left: '20px', right: '20px', height: '65%', containLabel: true } ],
                xAxis: [ { type: 'category', data: [], scale: true, boundaryGap: false } ],
                yAxis: [ { type: 'value', scale: true, axisLabel: { formatter: '{value} CNY' } } ],
                dataZoom: [ { type: 'inside', xAxisIndex: [0], start: 0, end: 100 }, { type: 'slider', xAxisIndex: [0], top: '85%', start: 0, end: 100 } ],
                series: [ { name: '价格', type: 'line', showSymbol: false, smooth: true, data: [], connectNulls: false,
                        markPoint: { data: [ { type: 'max', name: '最高价' }, { type: 'min', name: '最低价' } ] }
                    }
                ]
            };

            // --- 3. 加载K线图函数 (v4.40 - 关键修改) ---
            async function loadKLineData(period) {
                myChart.showLoading(); 
                try {
                    const response = await fetch(`${API_BASE_URL}/api/gold-data?period=${period}`);
                    if (!response.ok) throw new Error(`HTTP 错误! 状态: ${response.status}`);
                    const apiResponse = await response.json();
                    if (!apiResponse.success) throw new Error("API返回了K线错误");
                    
                    // (v4.40 修复) item[0]=Date, [1]=open, [2]=close, [3]=low, [4]=high
                    let kLineData = apiResponse.k_line_data.map(item => [item[1], item[2], item[3], item[4]]);
                    
                    // --- (v4.40 关键修改) ---
                    // 动态计算 15 个单位的缩放
                    const windowSize = 15;
                    const endIndex = apiResponse.dates.length - 1;
                    const startIndex = Math.max(0, endIndex - (windowSize - 1)); // -1 因为 14 个点包括终点
                    
                    const startValue = apiResponse.dates[startIndex];
                    const endValue = apiResponse.dates[endIndex];
                    // --- (v4.40 修改结束) ---
                    
                    myChart.setOption(kLineOptionTemplate, true); 
                    
                    myChart.setOption({
                        xAxis: [ { data: apiResponse.dates } ],
                        series: [ 
                            { name: 'K线', data: kLineData },
                            { name: 'MA5', data: apiResponse.ma5 },
                            { name: 'MA10', data: apiResponse.ma10 },
                            { name: 'MA20', data: apiResponse.ma20 }
                        ],
                        // (v4.40 关键修改) 使用 startValue 和 endValue
                        dataZoom: [ 
                            { type: 'inside', startValue: startValue, endValue: endValue }, 
                            { type: 'slider', top: '85%', startValue: startValue, endValue: endValue }
                        ]
                    });
                    
                    myChart.hideLoading(); 
                } catch (error) { myChart.showLoading({ text: `K线数据加载失败`, showSpinner: false }); }
            } 

            // --- 4. 加载分时图函数 (v4.29 - 缓存版) (不变) ---
            async function loadIntradayData() {
                myChart.showLoading();
                try {
                    const response = await fetch(`${API_BASE_URL}/api/gold-intraday`); // (v4.29) 新 API
                    if (!response.ok) throw new Error(`HTTP 错误! 状态: ${response.status}`);
                    const apiResponse = await response.json();
                    if (!apiResponse.success || !apiResponse.data) { throw new Error("API返回了无效的分时数据"); }
                    if (apiResponse.data.length === 0) {
                         myChart.showLoading({ text: `当前休市中...`, showSpinner: false });
                         return;
                    }
                    const axisLabels = []; const seriesValues = []; 
                    const GAP_THRESHOLD_MINUTES = 60; let lastTime = 0;
                    for (let i = 0; i < apiResponse.data.length; i++) {
                        const point = apiResponse.data[i]; 
                        const currentTime = new Date(point[0]).getTime();
                        const value = point[1];
                        if (i > 0) {
                            const gapInMinutes = (currentTime - lastTime) / (1000 * 60);
                            if (gapInMinutes > GAP_THRESHOLD_MINUTES) { axisLabels.push(''); seriesValues.push('-'); }
                        }
                        var date = new Date(currentTime);
                        var timeLabel = [date.getHours(), date.getMinutes()].map(function (n) { return n < 10 ? '0' + n : n; }).join(':');
                        axisLabels.push(timeLabel); seriesValues.push(value); lastTime = currentTime;     
                    }
                    myChart.clear(); myChart.setOption(intradayOptionTemplate, true); 
                    myChart.setOption({ xAxis: [ { data: axisLabels } ], series: [ { data: seriesValues } ] }, false);
                    myChart.hideLoading();
                } catch (error) { console.error("分时图加载失败:", error); myChart.showLoading({ text: `分时数据加载失败`, showSpinner: false }); }
            }
            
            // --- 5. 绑定按钮事件 (不变) ---
            const controlButtons = document.querySelectorAll('.k-line-button');
            controlButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const type = button.dataset.type; 
                    controlButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    if (type === 'intraday') { loadIntradayData(); } 
                    else if (type === 'kline') { loadKLineData(button.dataset.period); }
                });
            });
            
            // --- 6. 加载实时报价 (不变) ---
            const quoteContent = document.getElementById('realtime-content');
            async function loadRealtimeQuote() {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/gold-realtime-quote`);
                    if (!response.ok) return; 
                    const data = await response.json();
                    if (data.success) {
                        quoteContent.innerHTML = `
                            <div class="realtime-price">${data.price.toFixed(2)} CNY</div>
                            <div class="realtime-time">SGE 时间: ${data.time}</div>
                            <div class="realtime-time">最后更新: ${data.update_time}</div>
                        `;
                    }
                } catch (error) { /* 静默处理错误 */ }
            } 

            // --- 6.5 加载新闻快讯 (v4.26) (不变) ---
            const newsContent = document.getElementById('news-content');
            function formatNewsTime(isoString) {
                try {
                    const date = new Date(isoString);
                    const y = date.getFullYear(); const m = (date.getMonth() + 1).toString().padStart(2, '0');
                    const d = date.getDate().toString().padStart(2, '0'); const h = date.getHours().toString().padStart(2, '0');
                    const min = date.getMinutes().toString().padStart(2, '0');
                    return `${y}-${m}-${d} ${h}:${min}`;
                } catch(e) { return isoString; }
            }
            async function loadNewsData() {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/gold-news`);
                    if (!response.ok) { newsContent.innerHTML = '<div class="placeholder">新闻加载失败。</div>'; return; }
                    const apiResponse = await response.json();
                    if (apiResponse.success && apiResponse.data.length > 0) {
                        apiResponse.data.reverse(); let html = '';
                        apiResponse.data.forEach(item => {
                            const formattedTime = formatNewsTime(item.report_time);
                            let title = ''; let content = item.report_content;
                            if (content.startsWith('【') && content.includes('】')) {
                                const splitIndex = content.indexOf('】') + 1;
                                title = content.substring(0, splitIndex); content = content.substring(splitIndex);
                            }
                            html += `<div class="news-item"><div class="news-time">${formattedTime}</div><div class="news-title">${title}</div><div class="news-content">${content}</div></div>`;
                        });
                        newsContent.innerHTML = html;
                    } else { newsContent.innerHTML = '<div class="placeholder">暂无新闻。</div>'; }
                } catch (error) { console.error("新闻加载失败:", error); newsContent.innerHTML = '<div class="placeholder">新闻接口请求异常。</div>'; }
            }
            
            // --- 6.8 加载 AI 预测 (v4.30) (不变) ---
            const aiContent = document.getElementById('ai-content'); 
            async function loadAIPrediction() {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/ai-prediction`);
                    if (!response.ok) { aiContent.innerHTML = '<div class="placeholder">AI 模型加载失败...</div>'; return; }
                    const apiResponse = await response.json();
                    let signalColor = '#333';
                    if (apiResponse.signal === '看涨' || apiResponse.signal === '多头趋势') { signalColor = '#ff4d4f'; }
                    else if (apiResponse.signal === '看跌' || apiResponse.signal === '空头趋势') { signalColor = '#52c41a'; }
                    else if (apiResponse.signal === '震荡') { signalColor = '#faad14'; }
                    aiContent.innerHTML = `
                        <div style="text-align: center; margin-bottom: 15px;">
                            <div style="font-size: 1.8rem; font-weight: bold; color: ${signalColor};">
                                ${apiResponse.signal}
                            </div>
                        </div>
                        <div style="font-size: 0.9rem; color: #888; line-height: 1.4;">
                            <strong>分析:</strong> ${apiResponse.detail}
                        </div>`;
                } catch (error) { console.error("AI 分析加载失败:", error); aiContent.innerHTML = '<div class="placeholder">AI 分析接口请求异常。</div>'; }
            }

            // --- 6.9 加载全球市场数据 (v4.31) (不变) ---
            const marketsContent = document.getElementById('global-markets-content');
            function renderMarketItem(name, data) {
                // (v4.35) 健壮性检查
                if (typeof data.price !== 'number' || typeof data.change_pct !== 'number') {
                     return `<div class="global-market-item"><span class="name">${name}</span> <span class="price">数据获取失败</span></div>`;
                }
                let price = parseFloat(data.price);
                let change = parseFloat(data.change_pct);
                let changeClass = 'change-flat';
                if (change > 0) changeClass = 'change-up';
                else if (change < 0) changeClass = 'change-down';
                return `
                    <div class="global-market-item">
                        <span class="name">${name}</span>
                        <div>
                            <span class="price">${price.toFixed(2)}</span>
                            <span class="change ${changeClass}">
                                ${(change > 0 ? '+' : '') + change.toFixed(2)}%
                            </span>
                        </div>
                    </div>`;
            }
            async function loadGlobalMarkets() {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/global-markets`);
                    if (!response.ok) { marketsContent.innerHTML = '<div class="placeholder">全球市场加载失败。</div>'; return; }
                    const apiResponse = await response.json();
                    
                    if (apiResponse.success && apiResponse.data) {
                        let html = '';
                        html += renderMarketItem('国际黄金 (XAU/USD)', apiResponse.data.xau_usd);
                        html += renderMarketItem('美元指数 (DXY)', apiResponse.data.dxy);
                        html += renderMarketItem('美债10年 (US 10Y)', apiResponse.data.us_10y);
                        marketsContent.innerHTML = html;
                    } else {
                        marketsContent.innerHTML = '<div class="placeholder">暂无数据。</div>';
                    }
                } catch (error) { console.error("全球市场加载失败:", error); marketsContent.innerHTML = '<div class="placeholder">全球市场接口异常。</div>'; }
            }
            
            // --- 7. 初始加载 (v4.31) (不变) ---
            loadIntradayData(); 
            loadRealtimeQuote(); 
            loadNewsData(); 
            loadAIPrediction();
            loadGlobalMarkets(); 

            setInterval(loadRealtimeQuote, 10000); 
            setInterval(loadNewsData, 15 * 60 * 1000); 
            setInterval(loadAIPrediction, 15 * 60 * 1000); 
            setInterval(loadGlobalMarkets, 10 * 60 * 1000); 
            
            window.addEventListener('resize', () => myChart.resize());
            
        });
    </script>

</body>
</html>
