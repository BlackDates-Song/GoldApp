<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黄金仪表盘 (v1.1 - 修复缩放)</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    
    <style>
        /* --- 所有 CSS (和之前完全一样) --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5; margin: 0; padding: 20px; color: #333;
        }
        .dashboard-container {
            display: flex; flex-wrap: wrap; width: 100%; max-width: 1600px; margin: 0 auto;
        }
        .main-content {
            flex: 7; min-width: 600px; padding-right: 20px; box-sizing: border-box; 
        }
        .sidebar-content {
            flex: 3; min-width: 300px; display: flex; flex-direction: column; gap: 20px; 
        }
        .widget-card {
            background-color: #ffffff; border: 1px solid #e8e8e8; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 20px; box-sizing: border-box;
        }
        .widget-card h2 {
            margin-top: 0; margin-bottom: 15px; font-size: 1.25rem;
            border-bottom: 1px solid #f0f0f0; padding-bottom: 10px;
        }
        #k-line-card { width: 100%; }
        #chart-container { width: 100%; height: 600px; }
        .placeholder { color: #999; font-style: italic; }
        
        #k-line-controls {
            display: flex; gap: 10px; margin-bottom: 15px;
        }
        .k-line-button {
            padding: 8px 16px; font-size: 0.9rem; border: 1px solid #d9d9d9;
            background-color: #fff; color: #555; border-radius: 4px; cursor: pointer;
            transition: all 0.2s ease;
        }
        .k-line-button:hover {
            border-color: #40a9ff; color: #40a9ff;
        }
        .k-line-button.active {
            background-color: #1890ff; color: #fff; border-color: #1890ff;
        }
    </style>
</head>
<body>

    <h1 style="text-align: center; margin-bottom: 20px;">黄金ETF (518880.SS) 仪表盘</h1>

    <div class="dashboard-container">
        
        <div class="main-content">
            <div id="k-line-card" class="widget-card">
                <h2>K线图表</h2>
                <div id="k-line-controls">
                    <button class="k-line-button active" data-period="daily">日K</button>
                    <button class="k-line-button" data-period="weekly">周K</button>
                    <button class="k-line-button" data-period="monthly">月K</button>
                </div>
                <div id="chart-container"></div>
            </div>
        </div>

        <div class="sidebar-content">
            <div id="ai-widget" class="widget-card">
                <h2>AI分析</h2>
                <div class="placeholder">
                    <p>AI 预测信号将在这里显示...</p>
                </div>
            </div>
            <div id="info-widget" class="widget-card">
                <h2>信息</h2>
                <div class="placeholder">
                    <p>数据源: yfinance</p>
                    <p>标的: 518880.SS</p>
                </div>
            </div>
        </div>

    </div> <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            const API_BASE_URL = "http://127.0.0.1:8000";
            const chartContainer = document.getElementById('chart-container');
            if (!chartContainer) { console.error("无法找到 #chart-container！"); return; }
            
            const myChart = echarts.init(chartContainer);
            
            // --- *** 关键修改 1：定义缩放级别 *** ---
            const zoomLevels = {
                'daily': { start: 99, end: 100 }, // 显示最后 1%
                'weekly': { start: 90, end: 100 }, // 显示最后 10%
                'monthly': { start: 80, end: 100 }  // 显示最后 20%
            };
            
            // 全局 ECharts 配置 (我们从这里移除了 dataZoom)
            const chartOptionTemplate = {
                tooltip: { trigger: 'axis', axisPointer: { type: 'cross' } },
                legend: { data: ['K线'], top: 0 }, // 简化图例
                grid: [
                    { left: '8%', right: '5%', height: '50%' },
                    { left: '8%', right: '5%', top: '65%', height: '16%' }
                ],
                xAxis: [
                    { type: 'category', data: [], gridIndex: 0, scale: true },
                    { type: 'category', data: [], gridIndex: 1, axisLabel: { show: false }, scale: true }
                ],
                yAxis: [
                    { type: 'value', gridIndex: 0, scale: true, splitLine: { show: true }, axisLabel: { formatter: '{value} CNY' } },
                    { type: 'value', gridIndex: 1, axisLabel: { show: false }, axisTick: { show: false }, splitLine: { show: false } }
                ],
                // dataZoom 从这里移除, 放到 loadChartData 里动态设置
                series: [
                    { name: 'K线', type: 'candlestick', xAxisIndex: 0, yAxisIndex: 0, data: [] },
                    { name: '成交量', type: 'bar', xAxisIndex: 1, yAxisIndex: 1, data: [], itemStyle: { color: '#777' } }
                ]
            };
            
            // --- 2. 核心函数：加载并更新图表数据 ---
            async function loadChartData(period) {
                
                console.log(`正在请求 ${period} 数据...`);
                myChart.showLoading(); 
                
                try {
                    const response = await fetch(`${API_BASE_URL}/api/gold-data?period=${period}`);
                    if (!response.ok) throw new Error(`HTTP 错误! 状态: ${response.status}`);
                    
                    const apiResponse = await response.json();
                    if (!apiResponse.success) throw new Error("API返回了错误或数据为空");
                    
                    let kLineData = apiResponse.k_line_data.map(item => [item[1], item[2], item[3], item[4]]);
                    let volumeData = apiResponse.volume_data.map((item, index) => [index, item[1]]);
                    
                    // --- *** 关键修改 2：动态设置数据和缩放 *** ---
                    const newZoom = zoomLevels[period]; // 获取当前周期的缩放设置
                    
                    myChart.setOption({
                        xAxis: [
                            { data: apiResponse.dates }, // 更新X轴
                            { data: apiResponse.dates }
                        ],
                        series: [
                            { data: kLineData }, // 更新K线数据
                            { data: volumeData } // 更新成交量数据
                        ],
                        // 动态更新 dataZoom
                        dataZoom: [
                            { type: 'inside', xAxisIndex: [0, 1], start: newZoom.start, end: newZoom.end },
                            { type: 'slider', xAxisIndex: [0, 1], top: '85%', start: newZoom.start, end: newZoom.end }
                        ]
                    });
                    
                    myChart.hideLoading(); 
                    
                } catch (error) {
                    console.error(`加载 ${period} 数据失败:`, error);
                    myChart.hideLoading();
                    myChart.showLoading({ text: `数据加载失败: ${error.message}`, showSpinner: false });
                }
            } // end loadChartData
            
            
            // --- 4. 绑定按钮事件 (不变) ---
            const controlButtons = document.querySelectorAll('.k-line-button');
            controlButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const period = button.dataset.period; 
                    controlButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    loadChartData(period);
                });
            });
            
            // --- 5. 初始加载 ---
            myChart.setOption(chartOptionTemplate); // 先设置好模板
            loadChartData('daily'); // 默认加载日K (它会自动设置好 'daily' 的缩放)
            
            window.addEventListener('resize', () => myChart.resize());
            
        });
    </script>

</body>
</html>
