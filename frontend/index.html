<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGE 黄金仪表盘 (v4.50 - 国内宏观)</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 style="text-align: center; margin-bottom: 20px;">SGE 黄金 (Au99.99) 仪表盘</h1>
    
    <div class="dashboard-container">
        
        <div class="top-row">
            <div class="main-content">
                <div id="k-line-card" class="widget-card">
                    <h2>图表</h2>
                    <div id="k-line-controls">
                        <button class="k-line-button active" data-type="intraday">分时</button>
                        <button class="k-line-button" data-type="kline" data-period="daily">日K</button>
                        <button class="k-line-button" data-type="kline" data-period="weekly">周K</button>
                        <button class="k-line-button" data-type="kline" data-period="monthly">月K</button>
                    </div>
                    <div id="chart-container"></div>
                </div>
            </div>

            <div class="sidebar-content">
                <div id="realtime-quote-widget" class="widget-card">
                    <h2>实时行情 (Au99.99)</h2>
                    <div id="realtime-content">
                        <div class="placeholder">正在加载实时价格...</div>
                    </div>
                </div>
                
                <div id="global-markets-widget" class="widget-card">
                    <h2>全球市场</h2>
                    <div id="global-markets-content">
                        <div class="placeholder">正在加载...</div>
                    </div>
                </div>

                <div id="domestic-macro-widget" class="widget-card">
                    <h2>国内宏观</h2>
                    <div id="domestic-macro-content">
                        <div class="placeholder">正在加载...</div>
                    </div>
                </div>

                <div id="market-indicators-widget" class="widget-card">
                    <h2>市场指标</h2>
                    <div id="market-indicators-content">
                        <div class="placeholder">正在加载...</div>
                    </div>
                </div>

                <div id="ai-widget" class="widget-card">
                    <h2>AI分析 (日K)</h2>
                    <div id="ai-content">
                        <div class="placeholder">正在加载 AI 信号...</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bottom-row">
            <div id="news-widget" class="widget-card">
                <h2>贵金属快讯 (SHMET)</h2>
                <div id="news-content">
                    <div class="placeholder">正在加载新闻...</div>
                </div>
            </div>
        </div>

    </div> 
    
    <script type="module" src="js/main.js"></script>

</body>
</html>
