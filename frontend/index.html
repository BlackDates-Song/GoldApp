<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGE 黄金仪表盘 (v4.16 - 紧凑分时图)</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
    
    <style>
        /* --- (CSS 保持不变) --- */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f0f2f5; margin: 0; padding: 10px; color: #333;
        }
        h1 { text-align: center; margin-bottom: 20px; font-size: 1.8rem; }
        .dashboard-container { 
            display: flex; width: 100%; max-width: 1600px; margin: 0 auto; 
            gap: 20px; 
        }
        .main-content { flex: 7; min-width: 600px; box-sizing: border-box; }
        .sidebar-content { 
            flex: 3; min-width: 300px; display: flex; 
            flex-direction: column; gap: 20px; 
        }
        .widget-card {
            background-color: #ffffff; border: 1px solid #e8e8e8; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); padding: 20px; box-sizing: border-box;
            width: 100%; 
        }
        .widget-card h2 {
            margin-top: 0; margin-bottom: 15px; font-size: 1.25rem;
            border-bottom: 1px solid #f0f0f0; padding-bottom: 10px;
        }
        #chart-container { width: 100%; height: 550px; }
        #k-line-controls { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;}
        .k-line-button {
            padding: 8px 16px; font-size: 0.9rem; border: 1px solid #d9d9d9;
            background-color: #fff; color: #555; border-radius: 4px; cursor: pointer;
            transition: all 0.2s ease;
        }
        .k-line-button:hover { border-color: #40a9ff; color: #40a9ff; }
        .k-line-button.active { background-color: #1890ff; color: #fff; border-color: #1890ff; }
        .realtime-price {
            font-size: 2.0rem; font-weight: bold; 
            color: #ff4d4f; margin-bottom: 10px;
        }
        .realtime-time { font-size: 0.9rem; color: #888; }
        .placeholder { color: #999; font-style: italic; }
        
        @media (max-width: 992px) {
            body { padding: 5px; }
            .dashboard-container { flex-direction: column; gap: 20px; }
            .main-content { min-width: 100%; order: 2; }
            .sidebar-content { display: contents; }
            #realtime-quote-widget { order: 1; }
            #ai-widget { order: 3; }
            #chart-container { height: 400px; }
            h1 { font-size: 1.5rem; }
            .realtime-price { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <h1 style="text-align: center; margin-bottom: 20px;">SGE 黄金 (Au99.99) 仪表盘</h1>
    <div class="dashboard-container">
        <div class="main-content">
            <div id="k-line-card" class="widget-card">
                <h2>图表</h2>
                <div id="k-line-controls">
                    <button class="k-line-button active" data-type="intraday">分时</button>
                    <button class="k-line-button" data-type="kline" data-period="daily">日K</button>
                    <button class="k-line-button" data-type="kline" data-period="weekly">周K</button>
                    <button class="k-line-button" data-type="kline" data-period="monthly">月K</button>
                </div>
                <div id="chart-container"></div>
            </div>
        </div>
        <div class="sidebar-content">
            <div id="realtime-quote-widget" class="widget-card">
                <h2>实时行情 (Au99.99)</h2>
                <div id="realtime-content">
                    <div class="placeholder">正在加载实时价格...</div>
                </div>
            </div>
            <div id="ai-widget" class="widget-card">
                <h2>AI分析</h2>
                <div class="placeholder">
                    <p>AI 预测信号将在这里显示...</p>
                </div>
            </div>
        </div>
    </div> 
    
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            
            const API_BASE_URL = "https://goldapp-nfp9.onrender.com"; 
            const chartContainer = document.getElementById('chart-container');
            const myChart = echarts.init(chartContainer);
            
            // --- 1. K线图模板 (v4.17 - 修复移动端Y轴) ---
            const kLineOptionTemplate = {
                tooltip: { 
                    trigger: 'axis', 
                    axisPointer: { type: 'cross' },
                    formatter: function (params) {
                        let date = params[0].name;
                        let tooltipHtml = `${date}<br/>`; 
                        params.forEach(param => {
                            let seriesName = param.seriesName;
                            let color = param.color;
                            let value = param.value;
                            let marker = `<span style="display:inline-block;margin-right:5px;border-radius:10px;width:10px;height:10px;background-color:${color};"></span>`;
                            
                            if (seriesName === 'K线') {
                                tooltipHtml += `${marker} <strong>${seriesName}</strong><br/>`;
                                tooltipHtml += `  开盘价: <strong>${value[1]}</strong><br/>`;
                                tooltipHtml += `  收盘价: <strong>${value[2]}</strong><br/>`;
                                tooltipHtml += `  最低价: <strong>${value[3]}</strong><br/>`;
                                tooltipHtml += `  最高价: <strong>${value[4]}</strong><br/>`;
                            } else if (seriesName.startsWith('MA')) {
                                if (value !== null && value !== undefined) { 
                                     tooltipHtml += `${marker} ${seriesName}: <strong>${value}</strong><br/>`;
                                }
                            }
                        });
                        return tooltipHtml;
                    }
                },
                legend: { data: ['K线', 'MA5', 'MA10', 'MA20'], top: 0 },
                grid: [ { 
                    left: '20px', right: '20px', height: '65%',
                    containLabel: true  // 自动调整 Y 轴标签
                } ],
                xAxis: [ { type: 'category', data: [], gridIndex: 0, scale: true } ],
                yAxis: [ { type: 'value', gridIndex: 0, scale: true, splitLine: { show: true }, axisLabel: { formatter: '{value} CNY' } } ],
                dataZoom: [ { type: 'inside', xAxisIndex: [0] }, { type: 'slider', xAxisIndex: [0], top: '85%' } ],
                series: [ 
                    { 
                        name: 'K线', type: 'candlestick', 
                        xAxisIndex: 0, yAxisIndex: 0, data: [],
                        markPoint: {
                            symbol: 'pin', symbolSize: 50, label: { show: true, fontSize: 10, color: '#fff' },
                            data: [ { type: 'max', valueDim: 'highest' }, { type: 'min', valueDim: 'lowest' } ]
                        }
                    },
                    { name: 'MA5', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: [], smooth: true, showSymbol: false, lineStyle: { width: 1, opacity: 0.8 } },
                    { name: 'MA10', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: [], smooth: true, showSymbol: false, lineStyle: { width: 1, opacity: 0.8 } },
                    { name: 'MA20', type: 'line', xAxisIndex: 0, yAxisIndex: 0, data: [], smooth: true, showSymbol: false, lineStyle: { width: 1, opacity: 0.8 } }
                ]
            };
            
            // --- 2. 分时图模板 (v4.19 - 修复 20:00 空白) ---
            const intradayOptionTemplate = {
                tooltip: { 
                    trigger: 'axis',
                    formatter: function (params) {
                        var param = params[0];
                        if (!param || param.value === '-' || param.value === null) { return null; }
                        return param.name + '<br />价格: ' + param.value;
                    }
                },
                grid: [ { 
                    left: '20px', right: '20px', height: '65%',
                    containLabel: true  // 自动调整 Y 轴标签
                } ],
                xAxis: [
                    { 
                        type: 'category', 
                        data: [],         
                        scale: true,
                        boundaryGap: false // <-- (关键) 移除 20:00 的空白
                    }
                ],
                yAxis: [ { type: 'value', scale: true, axisLabel: { formatter: '{value} CNY' } } ],
                dataZoom: [ 
                    { type: 'inside', xAxisIndex: [0], start: 0, end: 100 }, 
                    { type: 'slider', xAxisIndex: [0], top: '85%', start: 0, end: 100 } 
                ],
                series: [
                    {
                        name: '价格', type: 'line', showSymbol: false, smooth: true, data: [],
                        connectNulls: false, 
                        markPoint: {
                            symbol: 'pin', symbolSize: 50, label: { show: true, fontSize: 10, color: '#fff' },
                            data: [ { type: 'max', name: '最高价' }, { type: 'min', name: '最低价' } ]
                        }
                    }
                ]
            };

            // --- 3. 加载K线图函数 (不变) ---
            async function loadKLineData(period) {
                myChart.showLoading(); 
                try {
                    const response = await fetch(`${API_BASE_URL}/api/gold-data?period=${period}`);
                    if (!response.ok) throw new Error(`HTTP 错误! 状态: ${response.status}`);
                    const apiResponse = await response.json();
                    if (!apiResponse.success) throw new Error("API返回了K线错误");
                    
                    let kLineData = apiResponse.k_line_data.map(item => [item[1], item[2], item[3], item[4]]);
                    const zoomLevels = { 'daily': 99, 'weekly': 93, 'monthly': 70 };
                    
                    myChart.setOption(kLineOptionTemplate, true); 
                    
                    myChart.setOption({
                        xAxis: [ { data: apiResponse.dates } ],
                        series: [ 
                            { name: 'K线', data: kLineData },
                            { name: 'MA5', data: apiResponse.ma5 },
                            { name: 'MA10', data: apiResponse.ma10 },
                            { name: 'MA20', data: apiResponse.ma20 }
                        ],
                        dataZoom: [ { start: zoomLevels[period], end: 100 }, { start: zoomLevels[period], end: 100 } ]
                    });
                    
                    myChart.hideLoading(); 
                } catch (error) {
                    myChart.showLoading({ text: `K线数据加载失败`, showSpinner: false });
                }
            } 

            // --- 4. 加载分时图函数 (v4.19 - 已移除昨日收盘线逻辑) ---
            async function loadIntradayData() {
                myChart.showLoading();
                try {
                    const response = await fetch(`${API_BASE_URL}/api/gold-intraday`);
                    if (!response.ok) throw new Error(`HTTP 错误! 状态: ${response.status}`);
                    
                    const apiResponse = await response.json();
                    if (!apiResponse.success || !apiResponse.data || apiResponse.data.length === 0) {
                        throw new Error("分时 API 数据为空");
                    }

                    // --- (不变) Category 轴数据处理 ---
                    const axisLabels = [];   
                    const seriesValues = []; 
                    const GAP_THRESHOLD_MINUTES = 60; 
                    let lastTime = 0;

                    for (let i = 0; i < apiResponse.data.length; i++) {
                        const point = apiResponse.data[i];
                        const currentTime = new Date(point[0]).getTime();
                        const value = point[1];

                        if (i > 0) {
                            const gapInMinutes = (currentTime - lastTime) / (1000 * 60);
                            if (gapInMinutes > GAP_THRESHOLD_MINUTES) {
                                axisLabels.push(''); 
                                seriesValues.push('-');
                            }
                        }
                        
                        var date = new Date(currentTime);
                        var timeLabel = [date.getHours(), date.getMinutes()].map(function (n) {
                            return n < 10 ? '0' + n : n;
                        }).join(':');

                        axisLabels.push(timeLabel); 
                        seriesValues.push(value);   
                        lastTime = currentTime;     
                    }
                    // --- (数据处理结束) ---

                    myChart.setOption(intradayOptionTemplate, true); 
                    
                    myChart.setOption({
                        xAxis: [ 
                            { data: axisLabels } 
                        ],
                        series: [ 
                            { 
                                data: seriesValues
                                // (已移除 markLine)
                            }
                        ] 
                    });
                    
                    myChart.hideLoading();
                } catch (error) {
                    console.error("分时图加载失败:", error);
                    myChart.showLoading({ text: `分时数据加载失败`, showSpinner: false });
                }
            }
            
            // --- 5. 绑定按钮事件 (不变) ---
            const controlButtons = document.querySelectorAll('.k-line-button');
            controlButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const type = button.dataset.type; 
                    controlButtons.forEach(btn => btn.classList.remove('active'));
                    button.classList.add('active');
                    if (type === 'intraday') { loadIntradayData(); } 
                    else if (type === 'kline') { loadKLineData(button.dataset.period); }
                });
            });
            
            // --- 6. 加载实时报价 (不变) ---
            const quoteContent = document.getElementById('realtime-content');
            async function loadRealtimeQuote() {
                try {
                    const response = await fetch(`${API_BASE_URL}/api/gold-realtime-quote`);
                    if (!response.ok) return; 
                    const data = await response.json();
                    if (data.success) {
                        quoteContent.innerHTML = `
                            <div class="realtime-price">${data.price.toFixed(2)} CNY</div>
                            <div class="realtime-time">SGE 时间: ${data.time}</div>
                            <div class="realtime-time">最后更新: ${data.update_time}</div>
                        `;
                    }
                } catch (error) { /* 静默处理错误 */ }
            } 
            
            // --- 7. 初始加载 (不变) ---
            loadIntradayData(); 
            loadRealtimeQuote(); 
            
            setInterval(loadRealtimeQuote, 10000); // 10秒刷新
            
            window.addEventListener('resize', () => myChart.resize());
            
        });
    </script>

</body>
</html>
